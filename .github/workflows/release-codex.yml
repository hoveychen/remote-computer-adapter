name: Release patched Codex

# Building Codex compiles a large Rust workspace, so this is not part of the
# ordinary tag release: it runs when someone asks for it, after the patches
# have been rebased onto a new upstream baseline.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to (must already exist)
        required: true
      codex_repo:
        description: Repository holding the patched Codex
        required: true
        default: hoveychen/codex
      codex_ref:
        # That fork's own main only mirrors upstream, so it carries none of
        # the patches; the branch below is the one that does. Defaulting to
        # main sent the build off to a tree 3000 commits behind the baseline,
        # which the build script rejected as "does not contain baseline".
        description: Ref in that repository to build
        required: true
        default: rca/native-state

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: rca
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.codex_repo }}
          ref: ${{ inputs.codex_ref }}
          path: codex
          # The build derives the patch list from history, so a shallow clone
          # would make it unable to describe what it built.
          fetch-depth: 0
      # codex-rs pins its toolchain in rust-toolchain.toml, so the target has
      # to be added to *that* toolchain. Adding it to stable installs it
      # somewhere cargo never looks, and the build fails with "can't find crate
      # for core" as if nothing had been installed at all.
      - name: Install the pinned Rust toolchain
        working-directory: codex/codex-rs
        run: |
          rustup show active-toolchain || rustup show
          rustup show active-toolchain
      - name: Add the musl target to the pinned toolchain
        if: matrix.runner == 'ubuntu-latest'
        working-directory: codex/codex-rs
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target list --installed
      # Codex's Linux package statically links bubblewrap against musl, which
      # needs a musl sysroot carrying libcap and a pkg-config that knows about
      # it. Codex solves this for its own CI, so use their script rather than
      # reinventing a cross-compilation environment here.
      - name: Install Zig
        if: matrix.runner == 'ubuntu-latest'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install the musl build tools
        if: matrix.runner == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
          TARGET: x86_64-unknown-linux-musl
          APT_UPDATE_ARGS: -o Acquire::Retries=3
          APT_INSTALL_ARGS: --no-install-recommends
        run: bash "$GITHUB_WORKSPACE/codex/.github/scripts/install-musl-build-tools.sh"
      - uses: extractions/setup-just@v4
      - name: Build the package
        run: rca/scripts/build-codex-package.sh --codex "$GITHUB_WORKSPACE/codex" --out "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: codex-native-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Attach to ${{ inputs.tag }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${{ inputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" --clobber
